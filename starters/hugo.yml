# getindiekit/hugo-starter  (~/indiekit/indiekit-hugo-starter)
services:
  indiekit:
    # Each starter gets its OWN database. The Mongo volume is shared, so without
    # this the admin lists posts belonging to whichever starter ran previously —
    # their files live in another repo, so every link is broken.
    environment:
      - MONGO_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo/indiekit_hugo?authSource=admin
    user: "${HOST_UID}:${HOST_GID}"
    volumes:
      - ../indiekit-hugo-starter/indiekit.config.js:/usr/src/app/indiekit.config.js:ro
      - ../indiekit-hugo-starter/content:/usr/src/app/content
      - ../indiekit-hugo-starter/static:/usr/src/app/static

  site:
    # Build-to-disk watcher, NOT `hugo server --renderToMemory`. Rendering to
    # memory makes a deleted post vanish instantly, which hides the fact that
    # `hugo` writing to disk never prunes it — the defect the smoke test's
    # delete assertion exists to catch, and which CI (serving public/ from
    # disk) does see. Wipe public/ on start so a restart is always clean.
    image: hugomods/hugo:latest
    user: "${HOST_UID}:${HOST_GID}"
    working_dir: /src
    environment:
      - HOME=/tmp
    command: sh -c "rm -rf /src/public && hugo --watch"
    volumes:
      - ../indiekit-hugo-starter:/src

  static:
    # The same dumb static server `npm run serve` and CI use, serving public/
    # from disk exactly as a real static host would.
    image: node:24-alpine
    working_dir: /src
    command: sh -c "npx --yes http-server public -p 8080 -s"
    ports:
      - "8080:8080"
    volumes:
      - ../indiekit-hugo-starter:/src

  mongo:
    ports:
      - "27018:27017"
