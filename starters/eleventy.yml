# getindiekit/eleventy-starter  (~/indiekit/indiekit-eleventy-starter)
services:
  indiekit:
    # Each starter gets its OWN database. The Mongo volume is shared, so without
    # this the admin lists posts belonging to whichever starter ran previously —
    # their files live in another repo, so every link is broken.
    environment:
      - MONGO_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo/indiekit_eleventy?authSource=admin
    user: "${HOST_UID}:${HOST_GID}"
    volumes:
      - ../indiekit-eleventy-starter/indiekit.config.js:/usr/src/app/indiekit.config.js:ro
      - ../indiekit-eleventy-starter/content:/usr/src/app/content

  site:
    # Build-only watcher. NOT `--serve`: Eleventy's dev server does not prune a
    # deleted post, so it keeps serving one — which is exactly what the smoke
    # test's delete assertion exists to catch. The `static` service below serves
    # the built output instead, as CI does.
    # glibc image (not alpine) so the host's node_modules loads, which is why no
    # anonymous mask is needed here — a root-owned anonymous volume is what made
    # `npm install` fail with EACCES as the host user.
    image: node:24-bookworm-slim
    user: "${HOST_UID}:${HOST_GID}"
    working_dir: /site
    environment:
      - HOME=/tmp
    command: sh -c "npm install --no-audit --no-fund && npx @11ty/eleventy --watch"
    volumes:
      - ../indiekit-eleventy-starter:/site

  static:
    # The same dumb static server `npm run serve` and CI use.
    image: node:24-alpine
    working_dir: /site
    command: sh -c "npx --yes http-server _site -p 8080 -s"
    ports:
      - "8080:8080"
    volumes:
      - ../indiekit-eleventy-starter:/site

  mongo:
    ports:
      - "27018:27017"
