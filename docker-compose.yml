services:
  indiekit:
    container_name: indiekit
    image: getindiekit/indiekit
    restart: always
    build: .
    ports:
      - "${HTTP_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - PUBLICATION_URL
      - GITHUB_USER
      - GITHUB_REPO
      - GITHUB_BRANCH
      - GITHUB_TOKEN
      - MASTODON_URL
      - MASTODON_USER
      - MASTODON_ACCESS_TOKEN
      - MONGO_URL=mongodb://$MONGO_INITDB_ROOT_USERNAME:$MONGO_INITDB_ROOT_PASSWORD@mongo
      - PASSWORD_SECRET
      - SECRET
  mongo:
    container_name: mongo
    image: mongo:8
    restart: always
    volumes:
      - mongo:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME
      - MONGO_INITDB_ROOT_PASSWORD
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo:
